packages:
  - apps/*
  - services/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true # used by tsx

# Single source of truth for shared dependency versions.
# Packages reference these with "catalog:" instead of a version range.
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^24.0.0
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.13.0
  prettier: ^3.9.10
  tsx: ^4.23.15
  # Held at 6.0.x: typescript-eslint supports TypeScript < 6.1.
  typescript: ~6.0.3
  typescript-eslint: ^8.72.1
  vitest: ^5.0.5
  zod: ^4.6.7

# pnpm only installs versions older than its minimum release age (supply-chain safety).
# Exceptions, pinned to exact versions: PGlite (test-only, in-process Postgres) and its peers.
minimumReleaseAgeExclude:
  - '@electric-sql/pglite-age@0.0.14'
  - '@electric-sql/pglite-pg_hashids@0.0.14'
  - '@electric-sql/pglite-pg_ivm@0.0.14'
  - '@electric-sql/pglite-pg_textsearch@0.0.15'
  - '@electric-sql/pglite-pg_uuidv7@0.0.14'
  - '@electric-sql/pglite-pgtap@0.0.14'
  - '@electric-sql/pglite-pgvector@0.0.14'
  - '@electric-sql/pglite-socket@0.2.16'
  - '@electric-sql/pglite@0.5.13'
