name: Ingest

# Builds the feed and deploys it to GitHub Pages.
# Also triggered every 30 min by cron-job.org via workflow_dispatch (see docs/ops.md): GitHub's own
# schedule can start late and is disabled after 60 days without commits.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never run two ingests at once (they share state); queue instead of cancelling.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          FEED_BASE_URLS: ${{ vars.FEED_BASE_URLS || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          CONTACT_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is not set. Without a database every run would start from scratch."
            exit 1
          fi
          pnpm pipeline:live --out "$RUNNER_TEMP/site"

      # Each Pages deploy replaces the whole site, so the static pages are included every time.
      - name: Assemble site
        run: cp -R web/. "$RUNNER_TEMP/site/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
