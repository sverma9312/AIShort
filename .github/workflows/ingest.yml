name: Ingest

# Runs the pipeline every 30 minutes and deploys the feed + static pages to GitHub Pages.
# Setup (once): docs/ops.md. Required secret: DATABASE_URL and at least one LLM key.
on:
  #schedule:
  #  - cron: '7,37 * * * *' # every 30 min, off the top of the hour (GitHub delays :00 jobs most)
  workflow_dispatch: # manual runs, and the external cron-job.org trigger

permissions:
  contents: read

# Never run two ingests at once (they share the database); queue instead of cancelling.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Run pipeline
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve feed URL
        env:
          FEED_BASE_URLS_OVERRIDE: ${{ vars.FEED_BASE_URLS }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Pages URLs are lowercase: https://<owner>.github.io/<repo>
          echo "FEED_BASE_URLS=${FEED_BASE_URLS_OVERRIDE:-https://${OWNER,,}.github.io/${REPO}}" >> "$GITHUB_ENV"

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_RPM: ${{ vars.GROQ_RPM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONTACT_URL: ${{ github.server_url }}/${{ github.repository }}
        run: pnpm pipeline:live --out "$RUNNER_TEMP/site" --report "$RUNNER_TEMP/run-report.json"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify-failure:
    name: Alert on failure
    needs: [ingest, deploy]
    if: ${{ failure() && !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL secret; skipping."
            exit 0
          fi
          curl -fsS -o /dev/null -H 'Content-Type: application/json' \
            -d "{\"content\":\"❌ **AIShort ingest failed** — $RUN_URL\"}" "$DISCORD_WEBHOOK_URL"
